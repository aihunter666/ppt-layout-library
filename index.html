<!doctype html>
<html lang="zh-CN"><head><base href="library/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPT 布局原图库</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#24372d;background:#f6f7f3}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}main{max-width:1440px;margin:auto;padding:48px 28px}h1{font-size:clamp(32px,5vw,58px);letter-spacing:-.04em;margin:0 0 16px}p{line-height:1.65;color:#53645a}.stat{font-weight:700;font-size:28px;color:#263c30}.toolbar{display:flex;gap:10px;flex-wrap:wrap;position:sticky;top:0;padding:16px 0;background:#f6f7f3f2;z-index:2}input,select,button{font:inherit;border:1px solid #c9d3c9;border-radius:8px;padding:11px;background:#fff;color:inherit}input{flex:1;min-width:220px}button{cursor:pointer}button:hover{border-color:#3e6550}select:disabled{opacity:.55;cursor:not-allowed}.meta{margin:12px 0 20px;color:#53645a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}.card{padding:14px;border:1px solid #d7dfd5;border-radius:12px;background:white;text-align:left;display:flex;flex-direction:column;gap:8px}.card img{width:100%;height:160px;object-fit:contain;background:#fafbf9}.card strong{font-size:17px}.card small{color:#657468;line-height:1.5}.more{margin:28px auto;display:block}dialog{border:1px solid #c9d3c9;border-radius:12px;width:min(94vw,1100px);max-height:94vh;padding:24px}dialog::backdrop{background:#14251e99}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:20px}dialog img{display:block;max-width:100%;max-height:65vh;margin:20px auto;object-fit:contain}.empty{grid-column:1/-1;padding:40px;text-align:center}@media(max-width:600px){main{padding:28px 16px}.toolbar{position:static}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:10px}.card img{height:110px}}
</style></head><body><main><h1>PPT 布局原图库</h1><p>按内容关系、页面类型和横竖比例选择布局。浏览 3207 张布局原图，按实际内容选择合适的结构。</p><div class="stat">3207 张原图</div><p>双击 HTML 即可离线浏览，无需启动服务。</p><div class="toolbar"><input id="query" type="search" placeholder="搜索编号、分类或关键词" aria-label="搜索布局"><select id="group" aria-label="页面类型"><option value="">全部页面类型</option><option value="cover">封面</option><option value="agenda">目录</option><option value="section">章节</option><option value="ending">尾页</option><option value="basic">基础内容</option><option value="professional">专业内容</option></select><select id="aspect" aria-label="页面比例"><option value="">横版与竖版</option><option>16:9</option><option>9:16</option></select><select id="category" aria-label="布局分类"><option value="">全部分类</option></select><button id="reset" type="button" hidden>清除筛选</button></div><div id="scope" class="meta" aria-live="polite"></div><div id="count" class="meta" aria-live="polite"></div><div id="grid" class="grid"></div><button id="more" class="more">再显示 80 个</button><p>编号、别名、分类和自然尺寸保留。图片用于构图检索与参考。</p></main><dialog id="detail"><div class="dialog-head"><strong id="detail-title"></strong><button id="close">关闭</button></div><img id="detail-img" alt=""><p id="detail-meta"></p><a id="download" download>打开原图</a></dialog><script src="data.js"></script><script>
const $=s=>document.querySelector(s);let limit=80;const rows=window.LAYOUTS;
for(const c of [...new Set(rows.flatMap(r=>r.categories))].sort((a,b)=>a.localeCompare(b,'zh'))){const o=document.createElement('option');o.value=c;o.textContent=c;$('#category').append(o)}
function searchTerms(){return $('#query').value.toLowerCase().trim().split(/\s+/).filter(Boolean)}
function queryMatches(r,terms){return terms.every(t=>JSON.stringify(r).toLowerCase().includes(t))}
function activeFilters(){const names={cover:'封面',agenda:'目录',section:'章节',ending:'尾页',basic:'基础内容',professional:'专业内容'};return [$('#group').value?'页面类型：'+names[$('#group').value]:'',$('#aspect').value?'比例：'+$('#aspect').value:'',$('#category').value?'分类：'+$('#category').value:''].filter(Boolean)}
function clearFilters(){for(const id of ['group','aspect','category'])$('#'+id).value='';limit=80;render()}
function filtered(){let terms=searchTerms();if(terms.length)return rows.filter(r=>queryMatches(r,terms));return rows.filter(r=>(!$('#group').value||r.groups?.includes($('#group').value)||r.group===$('#group').value)&&(!$('#aspect').value||r.aspect===$('#aspect').value)&&(!$('#category').value||r.categories.includes($('#category').value))&&queryMatches(r,terms))}
function detail(r){$('#detail-title').textContent=r.code+' · '+r.group_name;$('#detail-img').src=r.image;$('#detail-img').alt=r.code+'布局原图';$('#detail-meta').textContent=[r.aspect,r.natural_size.join(' × '),r.categories.join(' / '),r.aliases?.length?'别名：'+r.aliases.join('、'):''].filter(Boolean).join(' · ');$('#download').href=r.image;$('#detail').showModal()}
function render(){const searching=searchTerms().length>0;for(const id of ['group','aspect','category']){const select=$('#'+id);if(searching)select.value='';select.disabled=searching}const list=filtered();const active=activeFilters();$('#scope').textContent=searching?'关键词搜索范围：全部 3207 张布局。清空关键词后可使用筛选浏览。':active.length?'当前筛选：'+active.join(' · '):'搜索范围：全部布局';$('#reset').hidden=!active.length;$('#count').textContent=`找到 ${list.length} 张，显示 ${Math.min(limit,list.length)} 张`;$('title').textContent='PPT 布局原图库 · '+list.length;$('#grid').replaceChildren();for(const r of list.slice(0,limit)){const b=document.createElement('button');b.className='card';const i=document.createElement('img');i.loading='lazy';i.src=r.image;i.alt=r.code+' '+r.group_name;const s=document.createElement('strong');s.textContent=r.code;const t=document.createElement('small');t.textContent=r.group_name+' · '+r.aspect+' · '+r.categories.join(' / ');b.append(i,s,t);b.onclick=()=>detail(r);$('#grid').append(b)}if(!list.length){const e=document.createElement('div');e.className='empty';const message=document.createElement('p');const allMatches=active.length?rows.filter(r=>queryMatches(r,searchTerms())).length:0;message.textContent=active.length?(allMatches?'当前筛选下没有结果。清除筛选后，可找到 '+allMatches+' 张匹配布局。':'当前筛选下没有结果，请调整筛选或关键词。'):'没有匹配的布局，试试更短的关键词。';e.append(message);if(active.length){const reset=document.createElement('button');reset.type='button';reset.textContent='清除筛选，搜索全部布局';reset.onclick=clearFilters;e.append(reset)}$('#grid').append(e)}$('#more').hidden=limit>=list.length}
for(const id of ['query','group','aspect','category'])$('#'+id).oninput=()=>{limit=80;render()};$('#reset').onclick=clearFilters;$('#more').onclick=()=>{limit+=80;render()};$('#close').onclick=()=>$('#detail').close();render();
</script></body></html>
